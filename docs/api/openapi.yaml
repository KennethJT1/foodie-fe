# KJT Foodie API contract — DRAFT v0.1 (frontend copy).
# The master copy lives in the backend repo. Any change needs agreement from both teams.
# Phase 4 covers the shared conventions, auth and catalogue; later phases add every endpoint
# the mock handlers implement (src/mocks/handlers/).
openapi: 3.1.0
info:
  title: KJT Foodie API
  version: 0.1.0
  description: |
    Conventions
    - Base path `/api/v1`. JSON only. Money is always an integer in **kobo**.
    - Success envelope `{ success: true, data, meta? }`; error envelope `{ success: false, error }`.
    - Lists: `page`, `limit` (max 100), `sort` (`-field` = descending, comma for several),
      `search`, per-field filters (comma = any of, e.g. `status=paid,accepted`), `from` / `to` dates.
    - Feeds and comments use cursor pagination: `cursor`, `limit` → `meta.nextCursor`.
    - Access token in `Authorization: Bearer`; refresh token in an httpOnly cookie.
    - Times are ISO 8601 UTC; the UI shows Africa/Lagos.
servers:
  - url: /api/v1

security:
  - bearerAuth: []

tags:
  - name: System
  - name: Auth
  - name: Catalogue
  - name: Social
  - name: Account
  - name: Orders
  - name: Payments
  - name: Reviews
  - name: Refunds
  - name: Onboarding
    description: Vendor onboarding wizard, documents and bank account checks (FR-VEN-01, BR-PAY-02).
  - name: Subscriptions
    description: Plans, free trial, Paystack plan payments, cancel and downgrade (BRD section 4).
  - name: Vendor
    description: |
      The vendor's store: order steps, live queue, menu, sales, engagement, settings and staff.
      Real time: the vendor dashboard emits `vendor:subscribe` / `vendor:unsubscribe` `{ vendorId }`;
      the server emits `vendor:order:new` `{ vendorId, orderId, code, total, acceptDeadline }` when a
      paid order arrives. Orders not accepted by `acceptDeadline` are rejected and refunded (BR-PAY-04).
  - name: Notifications
    description: |
      In-app list over REST. Real time over Socket.IO: the client emits `order:subscribe` /
      `order:unsubscribe` `{ orderId }`; the server emits `order:status`
      `{ orderId, status, statusHistory, updatedAt, rider?, delivery? }` and `rider:location`
      `{ orderId, riderId, lat, lng, heading, etaMins, at }`.

paths:
  /health:
    get:
      tags: [System]
      security: []
      summary: Liveness check
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Success'
                  - properties:
                      data:
                        type: object
                        properties:
                          status: { type: string, example: ok }
                          time: { type: string, format: date-time }

  /auth/register:
    post:
      tags: [Auth]
      security: []
      summary: Sign up as a customer, vendor or rider (admins are created by a super admin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role, firstName, lastName, phone, password]
              properties:
                role: { type: string, enum: [customer, vendor, rider] }
                firstName: { type: string }
                lastName: { type: string }
                email: { type: string, format: email }
                phone: { type: string, example: '+2348031234567' }
                password: { type: string, minLength: 8 }
      responses:
        '201':
          description: Account created; an OTP is sent to the phone
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Success'
                  - properties:
                      data:
                        type: object
                        properties:
                          otpRequestId: { type: string }
                          phone: { type: string }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /auth/login:
    post:
      tags: [Auth]
      security: []
      summary: Log in with email + password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string }
                password: { type: string }
      responses:
        '200': { $ref: '#/components/responses/Session' }
        '401': { $ref: '#/components/responses/Unauthenticated' }

  /auth/otp/request:
    post:
      tags: [Auth]
      security: []
      summary: Send a login OTP by SMS
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone]
              properties:
                phone: { type: string }
                purpose: { type: string, enum: [login, verify, reset] }
      responses:
        '200':
          description: OTP sent
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Success'
                  - properties:
                      data:
                        type: object
                        properties:
                          otpRequestId: { type: string }
                          expiresInSec: { type: integer, example: 300 }
        '429': { $ref: '#/components/responses/RateLimited' }

  /auth/otp/verify:
    post:
      tags: [Auth]
      security: []
      summary: Verify an OTP and start a session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone, code]
              properties:
                phone: { type: string }
                code: { type: string, pattern: '^\d{6}$' }
                purpose: { type: string, enum: [login, verify, reset] }
      responses:
        '200': { $ref: '#/components/responses/Session' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /auth/refresh:
    post:
      tags: [Auth]
      security: []
      summary: Rotate the refresh cookie and get a new access token
      responses:
        '200': { $ref: '#/components/responses/Session' }
        '401': { $ref: '#/components/responses/Unauthenticated' }

  /auth/logout:
    post:
      tags: [Auth]
      summary: End the session and clear the refresh cookie
      responses:
        '204': { description: Logged out }

  /auth/password/forgot:
    post:
      tags: [Auth]
      security: []
      summary: Send a reset code to the phone or email
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                identifier: { type: string, description: Email or phone }
      responses:
        '200': { description: Always succeeds (no account enumeration) }

  /auth/password/reset:
    post:
      tags: [Auth]
      security: []
      summary: Set a new password with the reset code
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [identifier, code, password]
              properties:
                identifier: { type: string }
                code: { type: string }
                password: { type: string, minLength: 8 }
      responses:
        '200': { description: Password changed }
        '422': { $ref: '#/components/responses/ValidationError' }

  /me:
    get:
      tags: [Auth]
      summary: The signed-in user
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Success'
                  - properties:
                      data: { $ref: '#/components/schemas/User' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
    patch:
      tags: [Auth]
      summary: Edit profile
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                firstName: { type: string }
                lastName: { type: string }
                email: { type: string }
      responses:
        '200': { description: Updated user }

  /categories:
    get:
      tags: [Catalogue]
      security: []
      summary: Food categories
      parameters:
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/sort'
        - $ref: '#/components/parameters/search'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ListSuccess'
                  - properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/Category' }

  /feed:
    get:
      tags: [Catalogue]
      security: []
      summary: Home feed of food posts near a point (cursor pagination)
      parameters:
        - { name: lat, in: query, schema: { type: number } }
        - { name: lng, in: query, schema: { type: number } }
        - { name: tab, in: query, schema: { type: string, enum: [nearby, popular, newest, following] } }
        - $ref: '#/components/parameters/cursor'
        - $ref: '#/components/parameters/limit'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data: { type: array, items: { $ref: '#/components/schemas/FoodItem' } }
                  meta: { $ref: '#/components/schemas/CursorMeta' }

  /food-items:
    get:
      tags: [Catalogue]
      security: []
      summary: Search food items
      parameters:
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/sort'
        - $ref: '#/components/parameters/search'
        - { name: categoryId, in: query, schema: { type: string } }
        - { name: vendorId, in: query, schema: { type: string } }
        - { name: minPrice, in: query, description: kobo, schema: { type: integer } }
        - { name: maxPrice, in: query, description: kobo, schema: { type: integer } }
        - { name: maxDistanceKm, in: query, schema: { type: number } }
        - { name: minRating, in: query, schema: { type: number } }
        - { name: lat, in: query, schema: { type: number } }
        - { name: lng, in: query, schema: { type: number } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ListSuccess'
                  - properties:
                      data: { type: array, items: { $ref: '#/components/schemas/FoodItem' } }

  /food-items/{id}:
    get:
      tags: [Catalogue]
      security: []
      summary: One food item with its vendor
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Success'
                  - properties:
                      data: { $ref: '#/components/schemas/FoodItem' }
        '404': { $ref: '#/components/responses/NotFound' }

  /vendors/{slug}:
    get:
      tags: [Catalogue]
      security: []
      summary: Vendor storefront (hidden when the subscription has lapsed, BR-SUB-06)
      parameters:
        - { name: slug, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Vendor with opening hours and isOpen }
        '404': { $ref: '#/components/responses/NotFound' }

  /vendors:
    get:
      tags: [Catalogue]
      security: []
      summary: Visible vendors (approved with a live plan)
      parameters:
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/sort'
        - $ref: '#/components/parameters/search'
        - { name: city, in: query, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ListSuccess'
                  - properties:
                      data: { type: array, items: { $ref: '#/components/schemas/Vendor' } }

  /food-items/{id}/likes:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    post:
      tags: [Social]
      summary: Like a food post (customers)
      responses:
        '200': { $ref: '#/components/responses/LikeState' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
    delete:
      tags: [Social]
      summary: Remove a like
      responses:
        '200': { $ref: '#/components/responses/LikeState' }

  /me/likes:
    get:
      tags: [Social]
      summary: Food the signed-in customer liked
      parameters:
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/limit'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ListSuccess'
                  - properties:
                      data: { type: array, items: { $ref: '#/components/schemas/FoodItem' } }

  /food-items/{id}/comments:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    get:
      tags: [Social]
      security: []
      summary: Top-level comments (newest first) with vendor replies, cursor paginated
      parameters:
        - $ref: '#/components/parameters/cursor'
        - $ref: '#/components/parameters/limit'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data: { type: array, items: { $ref: '#/components/schemas/Comment' } }
                  meta: { $ref: '#/components/schemas/CursorMeta' }
    post:
      tags: [Social]
      summary: Comment (customers) or reply to a comment (the dish's vendor, parentId required)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [body]
              properties:
                body: { type: string, minLength: 1, maxLength: 500, description: Plain text }
                parentId: { type: string }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Success'
                  - properties: { data: { $ref: '#/components/schemas/Comment' } }
        '422': { $ref: '#/components/responses/ValidationError' }

  /comments/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    patch:
      tags: [Social]
      summary: Edit your own comment (sets editedAt)
      requestBody:
        content:
          application/json:
            schema: { type: object, properties: { body: { type: string, maxLength: 500 } } }
      responses:
        '200': { description: Updated comment }
    delete:
      tags: [Social]
      summary: Delete your own comment (shown as "Comment removed")
      responses:
        '200': { description: Removed }

  /reports:
    post:
      tags: [Social]
      summary: Report a comment or food post to the moderation queue
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [targetType, targetId, reason]
              properties:
                targetType: { type: string, enum: [comment, food_item] }
                targetId: { type: string }
                reason: { type: string }
      responses:
        '201': { description: Report created (or the existing open report) }

  /vendors/{id}/follow:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    post:
      tags: [Social]
      summary: Follow a vendor (customers)
      responses:
        '200': { $ref: '#/components/responses/FollowState' }
    delete:
      tags: [Social]
      summary: Unfollow a vendor
      responses:
        '200': { $ref: '#/components/responses/FollowState' }

  /me/follows:
    get:
      tags: [Social]
      summary: Vendors the signed-in customer follows
      parameters:
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/limit'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ListSuccess'
                  - properties:
                      data: { type: array, items: { $ref: '#/components/schemas/Vendor' } }

  /addresses:
    get:
      tags: [Account]
      summary: Saved delivery addresses (default first)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Success'
                  - properties:
                      data: { type: array, items: { $ref: '#/components/schemas/Address' } }
    post:
      tags: [Account]
      summary: Save an address (the first one becomes the default)
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/AddressInput' } } }
      responses:
        '201': { description: Created }
        '422': { $ref: '#/components/responses/ValidationError' }

  /addresses/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    patch:
      tags: [Account]
      summary: Update an address
      requestBody:
        content: { application/json: { schema: { $ref: '#/components/schemas/AddressInput' } } }
      responses:
        '200': { description: Updated }
    delete:
      tags: [Account]
      summary: Delete an address (another becomes default when needed)
      responses:
        '200': { description: Deleted }

  /addresses/{id}/default:
    post:
      tags: [Account]
      summary: Make an address the default
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: OK }

  /checkout/quote:
    post:
      tags: [Orders]
      summary: Price a cart on the server (subtotal, delivery fee, processing fee, total, ETA)
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/CheckoutInput' } } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Success'
                  - properties: { data: { $ref: '#/components/schemas/Quote' } }
        '422':
          description: >-
            Cannot be ordered: error.code is VENDOR_CLOSED (schedule for later), VENDOR_PAUSED,
            OUT_OF_RANGE, ITEM_UNAVAILABLE or EMPTY_CART
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }

  /payments/initialize:
    post:
      tags: [Payments]
      summary: Start a Paystack transaction for the cart. No order exists yet (FR-ORD-03).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/CheckoutInput'
                - properties: { deliveryNote: { type: string, maxLength: 200 } }
      responses:
        '200':
          description: Transaction ready for the Paystack popup
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Success'
                  - properties:
                      data:
                        type: object
                        properties:
                          reference: { type: string }
                          accessCode: { type: string }
                          amount: { type: integer, description: kobo }
                          email: { type: string }

  /payments/verify:
    post:
      tags: [Payments]
      summary: Confirm the payment with the gateway and create the order (idempotent)
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [reference], properties: { reference: { type: string } } }
      responses:
        '200':
          description: Paid; the order is returned
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Success'
                  - properties:
                      data:
                        type: object
                        properties:
                          status: { type: string, enum: [success] }
                          reference: { type: string }
                          order: { $ref: '#/components/schemas/Order' }
        '404': { $ref: '#/components/responses/NotFound' }

  /me/payments:
    get:
      tags: [Payments]
      summary: The customer's order payments (refunded when the order was cancelled or rejected)
      parameters:
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/sort'
        - $ref: '#/components/parameters/search'
        - { name: status, in: query, schema: { type: string, enum: [success, refunded, failed] } }
      responses:
        '200': { description: Page of payments }

  /orders:
    get:
      tags: [Orders]
      summary: >-
        Orders scoped by role: customers their own, vendors their store's, riders their trips,
        admins (orders.view) all
      parameters:
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/sort'
        - $ref: '#/components/parameters/search'
        - { name: status, in: query, description: comma = any of, schema: { type: string } }
        - { name: active, in: query, schema: { type: boolean } }
        - { name: vendorId, in: query, schema: { type: string } }
        - { name: customerId, in: query, schema: { type: string } }
        - { name: riderId, in: query, schema: { type: string } }
        - { name: from, in: query, schema: { type: string, format: date } }
        - { name: to, in: query, schema: { type: string, format: date } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ListSuccess'
                  - properties:
                      data: { type: array, items: { $ref: '#/components/schemas/Order' } }

  /orders/{id}:
    get:
      tags: [Orders]
      summary: Order with vendor, rider, delivery route, payment and refund
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Success'
                  - properties: { data: { $ref: '#/components/schemas/Order' } }
        '404': { $ref: '#/components/responses/NotFound' }

  /orders/{id}/cancel:
    post:
      tags: [Orders]
      summary: Customer cancels before the vendor accepts (FR-ORD-05); full refund
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        content:
          application/json:
            schema: { type: object, properties: { reason: { type: string } } }
      responses:
        '200': { description: Cancelled order }
        '409': { description: Already accepted (error.code CANNOT_CANCEL) }

  /orders/{id}/reviews:
    post:
      tags: [Reviews]
      summary: >-
        Customer rates the vendor or the rider of their delivered order (FR-SOC-06); once per
        target. Updates the target's rating and sets `ratedVendor` / `ratedRider` on the order.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [targetType, rating]
              properties:
                targetType: { type: string, enum: [vendor, rider] }
                rating: { type: integer, minimum: 1, maximum: 5 }
                comment: { type: string, maxLength: 500 }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Success'
                  - properties: { data: { $ref: '#/components/schemas/Review' } }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: Not delivered yet, or already rated }
        '422': { $ref: '#/components/responses/ValidationError' }

  /reviews:
    get:
      tags: [Reviews]
      security: []
      summary: Public reviews of a vendor or rider
      parameters:
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/sort'
        - $ref: '#/components/parameters/search'
        - { name: targetType, in: query, schema: { type: string, enum: [vendor, rider] } }
        - { name: targetId, in: query, schema: { type: string } }
        - { name: rating, in: query, description: comma = any of, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ListSuccess'
                  - properties:
                      data: { type: array, items: { $ref: '#/components/schemas/Review' } }

  /refunds:
    get:
      tags: [Refunds]
      summary: >-
        Refund requests scoped by role: customers their own, vendors their store's, admins
        (refunds.view) all
      parameters:
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/sort'
        - $ref: '#/components/parameters/search'
        - { name: status, in: query, description: comma = any of, schema: { type: string } }
        - { name: vendorId, in: query, schema: { type: string } }
        - { name: orderId, in: query, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ListSuccess'
                  - properties:
                      data: { type: array, items: { $ref: '#/components/schemas/Refund' } }
    post:
      tags: [Refunds]
      summary: >-
        Customer asks for a refund on a delivered order (BR-REF-02); one per order, amount up to
        the food subtotal. The vendor must respond before `deadline`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [orderId, reason, amount]
              properties:
                orderId: { type: string }
                reason: { type: string }
                details: { type: string, maxLength: 500 }
                amount: { type: integer, description: kobo, at most the order subtotal }
                photos: { type: array, maxItems: 3, items: { type: string, description: URL or data URI } }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Success'
                  - properties: { data: { $ref: '#/components/schemas/Refund' } }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: Order not delivered, or a refund already exists }
        '422': { $ref: '#/components/responses/ValidationError' }

  /refunds/{id}:
    get:
      tags: [Refunds]
      summary: Refund with its full timeline
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Success'
                  - properties: { data: { $ref: '#/components/schemas/Refund' } }
        '404': { $ref: '#/components/responses/NotFound' }

  /refunds/{id}/confirm:
    post:
      tags: [Refunds]
      summary: Customer confirms they received a refund the vendor marked as paid (BR-REF-04)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Refund (status confirmed) }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: Not marked as paid yet }

  /refunds/{id}/dispute:
    post:
      tags: [Refunds]
      summary: Customer disputes a paid or rejected refund; admins are notified (BR-REF-04)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties: { reason: { type: string, maxLength: 500 } }
      responses:
        '200': { description: Refund (status disputed) }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: The vendor has not responded yet }
        '422': { $ref: '#/components/responses/ValidationError' }

  /notifications:
    get:
      tags: [Notifications]
      summary: The signed-in user's in-app notifications
      parameters:
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/sort'
        - { name: unread, in: query, schema: { type: boolean } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ListSuccess'
                  - properties:
                      data: { type: array, items: { $ref: '#/components/schemas/Notification' } }

  /notifications/unread-count:
    get:
      tags: [Notifications]
      summary: Badge count for the bell
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Success'
                  - properties:
                      data: { type: object, properties: { count: { type: integer } } }

  /notifications/{id}/read:
    post:
      tags: [Notifications]
      summary: Mark one notification as read
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: The notification }
        '404': { $ref: '#/components/responses/NotFound' }

  /notifications/read-all:
    post:
      tags: [Notifications]
      summary: Mark every notification as read
      responses:
        '200': { description: OK }

  /vendor/onboarding:
    get:
      tags: [Onboarding]
      summary: The signed-in vendor's application, saved step and approval status
      responses:
        '200':
          description: Application
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Success'
                  - properties: { data: { $ref: '#/components/schemas/VendorOnboarding' } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
    patch:
      tags: [Onboarding]
      summary: Save one wizard step. Saved progress only moves forward.
      description: |
        Only while the application is `draft` or `rejected`. Fields per step:
        - `type`: `type` (restaurant | home_cook). Documents for the other type are dropped.
        - `business`: `name`, `description` (max 300), `phone`, `logo?`, `cover?`
        - `location`: `address { line1, area, city, state }`, `lat`, `lng`, `deliveryRadiusKm` (1–30), `prepTimeMins` (5–120)
        - `documents`: no fields; checks every required document is uploaded
        - `bank`: `bankCode`, `accountNumber` (10 digits); the account name is resolved and stored
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [step]
              properties:
                step: { type: string, enum: [type, business, location, documents, bank] }
              additionalProperties: true
      responses:
        '200': { description: Updated application (VendorOnboarding) }
        '409': { description: Already submitted and not rejected (ALREADY_SUBMITTED) }
        '422': { $ref: '#/components/responses/ValidationError' }

  /vendor/onboarding/submit:
    post:
      tags: [Onboarding]
      summary: Send the application for admin review; status becomes pending (FR-VEN-02)
      responses:
        '200': { description: Updated application (approvalStatus pending) }
        '409': { description: Already submitted }
        '422': { description: Some steps are not finished }

  /vendor/documents:
    post:
      tags: [Onboarding]
      summary: Attach an uploaded document. One per type; a new upload replaces the old one.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type, url]
              properties:
                type: { type: string, example: government_id }
                url: { type: string, description: URL from the upload service }
      responses:
        '201': { description: Document }
        '422': { $ref: '#/components/responses/ValidationError' }

  /vendor/documents/{id}:
    delete:
      tags: [Onboarding]
      summary: Remove a document before submitting
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '204': { description: Removed }
        '404': { $ref: '#/components/responses/NotFound' }

  /banks:
    get:
      tags: [Onboarding]
      summary: Nigerian banks supported for settlement (from Paystack)
      security: []
      responses:
        '200': { description: 'Array of { code, name }' }

  /banks/resolve:
    post:
      tags: [Onboarding]
      summary: Look up the account name for a bank account (Paystack resolve)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [bankCode, accountNumber]
              properties:
                bankCode: { type: string }
                accountNumber: { type: string, pattern: '^\d{10}$' }
      responses:
        '200': { description: '{ bankCode, bankName, accountNumber, accountName }' }
        '422': { description: 'Unknown bank or account not found (fieldErrors.accountNumber)' }

  /plans:
    get:
      tags: [Subscriptions]
      summary: Plans on sale, cheapest first
      security: []
      responses:
        '200':
          description: Plans; `meta` carries the trial length and yearly discount
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, const: true }
                  data: { type: array, items: { $ref: '#/components/schemas/Plan' } }
                  meta:
                    type: object
                    properties:
                      trialDays: { type: integer }
                      yearlyDiscountPct: { type: number }

  /vendor/subscription:
    get:
      tags: [Subscriptions]
      summary: The vendor's plan status, current period and whether the free trial is still available
      responses:
        '200':
          description: Subscription state
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Success'
                  - properties: { data: { $ref: '#/components/schemas/VendorSubscription' } }

  /vendor/subscription/invoices:
    get:
      tags: [Subscriptions]
      summary: The vendor's plan invoices
      parameters:
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/sort'
        - { name: status, in: query, schema: { type: string, enum: [paid, failed] } }
      responses:
        '200': { description: 'Page of invoices { id, planId, planName, interval, amount, status, reference, createdAt }' }

  /vendor/subscription/trial:
    post:
      tags: [Subscriptions]
      summary: Start the free trial (once per business, after approval, no card) (BR-SUB-01)
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [planId], properties: { planId: { type: string } } }
      responses:
        '200': { description: VendorSubscription (status trial) }
        '409': { description: Not approved yet (NOT_APPROVED) or trial already used (TRIAL_USED) }
        '422': { $ref: '#/components/responses/ValidationError' }

  /vendor/subscription/initialize:
    post:
      tags: [Subscriptions]
      summary: Start a Paystack payment for a first plan, a renewal or a prorated upgrade (BR-SUB-03)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PlanChoice' }
      responses:
        '200':
          description: Transaction ready for the Paystack popup
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Success'
                  - properties:
                      data:
                        type: object
                        properties:
                          reference: { type: string }
                          accessCode: { type: string }
                          amount: { type: integer, description: kobo; prorated for upgrades }
                          kind: { type: string, enum: [new, upgrade] }
                          email: { type: string }
        '409': { description: Already on this plan (SAME_PLAN) or a downgrade (DOWNGRADE_AT_RENEWAL) }
        '422': { $ref: '#/components/responses/ValidationError' }

  /vendor/subscription/verify:
    post:
      tags: [Subscriptions]
      summary: Confirm the plan payment with the gateway and activate the plan (idempotent)
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [reference], properties: { reference: { type: string } } }
      responses:
        '200': { description: VendorSubscription (status active); an invoice is recorded }
        '404': { $ref: '#/components/responses/NotFound' }

  /vendor/subscription/change:
    post:
      tags: [Subscriptions]
      summary: Schedule a downgrade for the next renewal (BR-SUB-03)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PlanChoice' }
      responses:
        '200': { description: VendorSubscription with scheduledChange }
        '409': { description: Not a downgrade; pay through initialize instead (PAYMENT_REQUIRED) }

  /vendor/subscription/cancel:
    post:
      tags: [Subscriptions]
      summary: Cancel at period end; access continues until then (BR-SUB-02)
      responses:
        '200': { description: VendorSubscription (cancelAtPeriodEnd true) }
        '409': { description: No running plan }

  /vendor/subscription/resume:
    post:
      tags: [Subscriptions]
      summary: Undo a cancellation before the period ends
      responses:
        '200': { description: VendorSubscription (cancelAtPeriodEnd false) }
        '409': { description: The plan has already ended }

  /orders/{id}/accept:
    post:
      tags: [Vendor]
      summary: Accept a paid order before its acceptDeadline
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        '200': { description: Order (status accepted) }
        '409': { description: Not in the paid state, or already auto-rejected (INVALID_STATUS) }

  /orders/{id}/reject:
    post:
      tags: [Vendor]
      summary: Reject a paid or accepted order with a reason; the customer is refunded in full
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [reason], properties: { reason: { type: string, maxLength: 200 } } }
      responses:
        '200': { description: Order (status rejected) }
        '409': { description: Already being prepared }
        '422': { $ref: '#/components/responses/ValidationError' }

  /orders/{id}/preparing:
    post:
      tags: [Vendor]
      summary: Mark an accepted order as being prepared
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        '200': { description: Order (status preparing) }
        '409': { description: Wrong status }

  /orders/{id}/ready:
    post:
      tags: [Vendor]
      summary: Mark as ready for pickup; dispatch starts looking for a rider
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        '200': { description: Order (status ready_for_pickup) }
        '409': { description: Wrong status }

  /vendor/stats:
    get:
      tags: [Vendor]
      summary: Overview numbers for today, waiting orders, rating, a daily sales series and top dishes
      parameters: [{ name: days, in: query, schema: { type: integer, default: 14, maximum: 90 } }]
      responses:
        '200':
          description: |
            `{ today: { orders, sales, ordersChange, salesChange }, waiting, inProgress, rating,
            ratingCount, followersCount, isPaused, series: [{ date, orders, sales }],
            topItems: [{ foodItemId, name, quantity, sales }] }` (money in kobo, dates are Lagos days)

  /vendor/sales:
    get:
      tags: [Vendor]
      summary: Food money per order with its Paystack settlement status
      parameters:
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/sort'
        - $ref: '#/components/parameters/search'
        - { name: settlementStatus, in: query, schema: { type: string, enum: [settling, settled, refunded] } }
        - { name: from, in: query, schema: { type: string, format: date } }
        - { name: to, in: query, schema: { type: string, format: date } }
      responses:
        '200':
          description: |
            Rows `{ id, orderId, orderCode, customerName, amount, settlementStatus, reference, createdAt }`;
            `meta.summary` = `{ settling, settled, refunded }` over the whole filtered range

  /vendor/sales/daily:
    get:
      tags: [Vendor]
      summary: Food sales per Lagos day, newest first
      parameters: [{ name: days, in: query, schema: { type: integer, default: 30, maximum: 90 } }]
      responses:
        '200': { description: 'Array of { date, orders, amount, settling, settled }' }

  /vendor/menu:
    get:
      tags: [Vendor]
      summary: The vendor's own menu, including sold-out items
      parameters:
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/sort'
        - $ref: '#/components/parameters/search'
        - { name: categoryId, in: query, schema: { type: string } }
        - { name: availability, in: query, schema: { type: string, enum: [available, sold_out] } }
      responses:
        '200': { description: 'Page of food items; meta.limits = { menuItems, photosPerItem, planName, used }' }
    post:
      tags: [Vendor]
      summary: Add a menu item within the plan's item and photo limits
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/MenuItemInput' } } }
      responses:
        '201': { description: Food item }
        '409': { description: Plan item limit reached (PLAN_LIMIT) }
        '422': { $ref: '#/components/responses/ValidationError' }

  /vendor/menu/{id}:
    parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
    get:
      tags: [Vendor]
      summary: One of the vendor's menu items, with the plan limits
      responses:
        '200': { description: Food item plus `limits` }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Vendor]
      summary: Edit a menu item, or just `{ isAvailable }` to mark it sold out / back on sale
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/MenuItemInput' } } }
      responses:
        '200': { description: Food item }
        '422': { $ref: '#/components/responses/ValidationError' }
    delete:
      tags: [Vendor]
      summary: Delete a menu item (past orders keep their own copy)
      responses:
        '204': { description: Deleted }

  /vendor/store:
    get:
      tags: [Vendor]
      summary: Store settings (bank shown as the last 4 digits only)
      responses:
        '200': { description: 'Store { isPaused, deliveryRadiusKm, prepTimeMins, openingHours, description, logo, cover, bank, bankChangeRequest }' }
    patch:
      tags: [Vendor]
      summary: Update hours, pause orders, delivery radius, prep time or store page details (FR-VEN-03)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                isPaused: { type: boolean }
                deliveryRadiusKm: { type: number, minimum: 1, maximum: 30 }
                prepTimeMins: { type: integer, minimum: 5, maximum: 120 }
                description: { type: string, maxLength: 300 }
                logo: { type: [string, 'null'] }
                cover: { type: [string, 'null'] }
                openingHours:
                  type: array
                  minItems: 7
                  maxItems: 7
                  items:
                    type: object
                    properties:
                      open: { type: string, example: '09:00' }
                      close: { type: string, example: '21:00' }
                      closed: { type: boolean }
      responses:
        '200': { description: Store }
        '422': { $ref: '#/components/responses/ValidationError' }

  /vendor/bank-change:
    post:
      tags: [Vendor]
      summary: Ask to change the settlement account; it is resolved now and approved by an admin (BR-PAY-02)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [bankCode, accountNumber]
              properties: { bankCode: { type: string }, accountNumber: { type: string } }
      responses:
        '200': { description: Store with bankChangeRequest (status pending) }
        '409': { description: A change is already waiting }
        '422': { $ref: '#/components/responses/ValidationError' }

  /vendor/staff:
    get:
      tags: [Vendor]
      summary: Staff logins and the plan limit
      responses:
        '200': { description: '{ staff: [{ id, name, email, role, createdAt }], limit, planName }' }
    post:
      tags: [Vendor]
      summary: Invite a staff member (manager or kitchen)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email, role]
              properties:
                name: { type: string }
                email: { type: string, format: email }
                role: { type: string, enum: [manager, kitchen] }
      responses:
        '201': { description: Staff member }
        '409': { description: Plan staff limit reached (PLAN_LIMIT) }
        '422': { $ref: '#/components/responses/ValidationError' }

  /vendor/staff/{id}:
    delete:
      tags: [Vendor]
      summary: Remove a staff login
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        '204': { description: Removed }

  /vendor/engagement:
    get:
      tags: [Vendor]
      summary: Likes, followers, unanswered comments and most liked dishes
      responses:
        '200': { description: '{ likesCount, followersCount, newFollowers, unansweredComments, rating, ratingCount, topLiked, recentFollowers }' }

  /vendor/comments:
    get:
      tags: [Vendor]
      summary: Customers' comments on the vendor's dishes; reply with POST /food-items/{id}/comments and parentId
      parameters:
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/limit'
        - { name: answered, in: query, schema: { type: boolean } }
      responses:
        '200': { description: 'Page of { id, foodItemId, foodItemName, authorName, body, createdAt, isAnswered, reply }' }

  /reviews/{id}/reply:
    post:
      tags: [Reviews]
      summary: The vendor replies once to a review of their store
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [body], properties: { body: { type: string, maxLength: 500 } } }
      responses:
        '200': { description: Review with reply }
        '409': { description: Already replied }

  /refunds/{id}/respond:
    post:
      tags: [Refunds]
      summary: The vendor accepts (full or part) or rejects a refund request before the deadline (BR-REF-03)
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision]
              properties:
                decision: { type: string, enum: [accepted, rejected] }
                amount: { type: integer, description: kobo, up to the food subtotal; required when accepted }
                reason: { type: string, maxLength: 500, description: required when rejected }
      responses:
        '200': { description: Refund (accepted or rejected) }
        '409': { description: Already answered }
        '422': { $ref: '#/components/responses/ValidationError' }

  /refunds/{id}/mark-paid:
    post:
      tags: [Refunds]
      summary: The vendor records the refund payment reference; the customer is asked to confirm
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [reference], properties: { reference: { type: string } } }
      responses:
        '200': { description: Refund (status paid) }
        '409': { description: Not accepted yet }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer

  parameters:
    page: { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
    limit: { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
    sort: { name: sort, in: query, schema: { type: string, example: '-createdAt' } }
    search: { name: search, in: query, schema: { type: string } }
    cursor: { name: cursor, in: query, schema: { type: string } }

  schemas:
    Success:
      type: object
      required: [success, data]
      properties:
        success: { type: boolean, const: true }
        data: {}

    ListSuccess:
      type: object
      required: [success, data, meta]
      properties:
        success: { type: boolean, const: true }
        data: { type: array, items: {} }
        meta: { $ref: '#/components/schemas/PageMeta' }

    PageMeta:
      type: object
      properties:
        page: { type: integer }
        limit: { type: integer }
        total: { type: integer }
        totalPages: { type: integer }
        hasNextPage: { type: boolean }
        hasPrevPage: { type: boolean }

    CursorMeta:
      type: object
      properties:
        nextCursor: { type: [string, 'null'] }
        limit: { type: integer }

    Error:
      type: object
      required: [success, error]
      properties:
        success: { type: boolean, const: false }
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string, example: VALIDATION_ERROR }
            message: { type: string, example: Please check the highlighted fields. }
            fieldErrors:
              type: object
              additionalProperties: { type: string }
              example: { email: Enter a valid email address }

    User:
      type: object
      properties:
        id: { type: string }
        role: { type: string, enum: [customer, vendor, rider, admin] }
        adminRole: { type: string, enum: [super_admin, support, finance, dispatch, onboarding] }
        permissions: { type: array, items: { type: string } }
        firstName: { type: string }
        lastName: { type: string }
        name: { type: string }
        email: { type: string }
        phone: { type: string }
        avatar: { type: [string, 'null'] }
        status: { type: string, enum: [active, suspended, banned] }
        vendor:
          type: object
          description: Present for vendor accounts
          properties:
            id: { type: string }
            slug: { type: string }
            approvalStatus: { type: string, enum: [draft, pending, approved, rejected, suspended] }
            subscriptionStatus: { type: string, enum: [none, trial, active, grace, expired, cancelled] }
        rider:
          type: object
          description: Present for rider accounts
          properties:
            id: { type: string }
            approvalStatus: { type: string }
            isOnline: { type: boolean }

    Category:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        slug: { type: string }
        icon: { type: string }
        itemCount: { type: integer }

    FoodItem:
      type: object
      properties:
        id: { type: string }
        vendorId: { type: string }
        categoryId: { type: string }
        name: { type: string }
        description: { type: string, maxLength: 500 }
        price: { type: integer, description: kobo }
        photos: { type: array, items: { type: string, format: uri } }
        portion: { type: string }
        prepTimeMins: { type: integer }
        isAvailable: { type: boolean }
        availableDays: { type: array, items: { type: integer, minimum: 0, maximum: 6 } }
        optionGroups:
          type: array
          items:
            type: object
            properties:
              id: { type: string }
              name: { type: string }
              required: { type: boolean }
              max: { type: integer }
              options:
                type: array
                items:
                  type: object
                  properties:
                    id: { type: string }
                    name: { type: string }
                    price: { type: integer, description: kobo }
        likesCount: { type: integer }
        commentsCount: { type: integer }
        isLiked: { type: boolean, description: For the signed-in user }
        distanceM: { type: integer }
        vendor:
          type: object
          properties:
            id: { type: string }
            name: { type: string }
            slug: { type: string }
            logo: { type: string }
            rating: { type: number }
            isOpen: { type: boolean }
        createdAt: { type: string, format: date-time }

    Vendor:
      type: object
      description: Public storefront fields (no bank details or documents)
      properties:
        id: { type: string }
        name: { type: string }
        slug: { type: string }
        logo: { type: [string, 'null'] }
        cover: { type: [string, 'null'] }
        description: { type: string, maxLength: 300 }
        rating: { type: number }
        ratingCount: { type: integer }
        followersCount: { type: integer }
        isFollowing: { type: boolean }
        isOpen: { type: boolean, description: Computed from openingHours in Africa/Lagos }
        isPaused: { type: boolean }
        prepTimeMins: { type: integer }
        deliveryRadiusKm: { type: number }
        distanceM: { type: integer }
        address:
          type: object
          properties:
            line1: { type: string }
            area: { type: string }
            city: { type: string }
            state: { type: string }
        openingHours:
          type: array
          items:
            type: object
            properties:
              day: { type: integer, minimum: 0, maximum: 6, description: 0 = Sunday }
              open: { type: string, example: '09:00' }
              close: { type: string, example: '21:00' }
              closed: { type: boolean }

    Comment:
      type: object
      properties:
        id: { type: string }
        foodItemId: { type: string }
        parentId: { type: [string, 'null'] }
        body: { type: [string, 'null'], description: null when removed }
        removed: { type: boolean }
        isVendorReply: { type: boolean }
        isMine: { type: boolean }
        editedAt: { type: [string, 'null'], format: date-time }
        author:
          type: object
          properties:
            id: { type: string }
            name: { type: string }
            avatar: { type: [string, 'null'] }
        replies: { type: array, items: { $ref: '#/components/schemas/Comment' } }
        createdAt: { type: string, format: date-time }

    Address:
      type: object
      properties:
        id: { type: string }
        label: { type: string, example: Home }
        line1: { type: string }
        area: { type: string }
        city: { type: string }
        state: { type: string }
        lat: { type: number }
        lng: { type: number }
        directions: { type: string }
        isDefault: { type: boolean }

    AddressInput:
      type: object
      required: [line1, area, city, lat, lng]
      properties:
        label: { type: string }
        line1: { type: string }
        area: { type: string }
        city: { type: string }
        state: { type: string }
        lat: { type: number }
        lng: { type: number }
        directions: { type: string }
        isDefault: { type: boolean }

    CheckoutInput:
      type: object
      required: [vendorId, items]
      properties:
        vendorId: { type: string }
        items:
          type: array
          items:
            type: object
            properties:
              foodItemId: { type: string }
              quantity: { type: integer, minimum: 1 }
              optionIds: { type: array, items: { type: string } }
        addressId: { type: string, description: A saved address, or send `address` }
        address: { $ref: '#/components/schemas/AddressInput' }
        scheduledFor:
          type: [string, 'null']
          format: date-time
          description: FR-ORD-07; required when the vendor is closed now

    OrderLine:
      type: object
      properties:
        foodItemId: { type: string }
        name: { type: string }
        photo: { type: [string, 'null'] }
        unitPrice: { type: integer, description: kobo }
        quantity: { type: integer }
        lineTotal: { type: integer, description: kobo }
        options:
          type: array
          items:
            type: object
            properties:
              groupId: { type: string }
              groupName: { type: string }
              optionId: { type: string }
              name: { type: string }
              price: { type: integer }

    Quote:
      type: object
      properties:
        lines: { type: array, items: { $ref: '#/components/schemas/OrderLine' } }
        subtotal: { type: integer }
        deliveryFee: { type: integer }
        processingFee: { type: integer }
        total: { type: integer }
        distanceM: { type: integer }
        etaMins: { type: array, items: { type: integer }, example: [25, 35] }
        isOpen: { type: boolean }
        scheduledFor: { type: [string, 'null'], format: date-time }

    Order:
      type: object
      properties:
        id: { type: string }
        code: { type: string, example: 4F7Q2A }
        status:
          type: string
          enum: [paid, accepted, rejected, preparing, ready_for_pickup, rider_assigned, picked_up, delivered, cancelled]
        customerId: { type: string }
        customerName: { type: string }
        vendorId: { type: string }
        vendorName: { type: string }
        riderId: { type: [string, 'null'] }
        items: { type: array, items: { $ref: '#/components/schemas/OrderLine' } }
        subtotal: { type: integer }
        deliveryFee: { type: integer }
        processingFee: { type: integer }
        total: { type: integer }
        address: { $ref: '#/components/schemas/Address' }
        deliveryNote: { type: string }
        scheduledFor: { type: [string, 'null'], format: date-time }
        deliveryCode: { type: string, description: Only for the customer and admins }
        etaMins: { type: array, items: { type: integer } }
        isActive: { type: boolean }
        statusHistory:
          type: array
          items:
            type: object
            properties:
              status: { type: string }
              at: { type: string, format: date-time }
              by: { type: string, enum: [system, customer, vendor, rider, admin] }
        ratedVendor: { type: boolean }
        ratedRider: { type: boolean }
        vendor: { type: object, description: Detail only — name, slug, logo, phone, lat, lng }
        rider: { type: [object, 'null'], description: Detail only — name, phone, vehicle, lat, lng }
        delivery: { type: [object, 'null'], description: Detail only — pickup, dropoff, route }
        payment: { type: [object, 'null'], description: Detail only — reference, channel, status }
        refund: { type: [object, 'null'], description: Detail only — id, status, amount }
        createdAt: { type: string, format: date-time }

    Review:
      type: object
      properties:
        id: { type: string }
        orderId: { type: string }
        targetType: { type: string, enum: [vendor, rider] }
        targetId: { type: string }
        userId: { type: string }
        userName: { type: string }
        rating: { type: integer, minimum: 1, maximum: 5 }
        comment: { type: string, maxLength: 500 }
        reply: { type: [string, 'null'], description: Vendor reply }
        createdAt: { type: string, format: date-time }

    RefundStep:
      type: object
      properties:
        status:
          type: string
          enum: [requested, accepted, rejected, paid, confirmed, disputed, escalated]
        at: { type: string, format: date-time }
        by: { type: string, enum: [system, customer, vendor, admin] }
        note: { type: [string, 'null'] }

    Refund:
      type: object
      properties:
        id: { type: string }
        orderId: { type: string }
        orderCode: { type: string }
        customerId: { type: string }
        customerName: { type: string }
        vendorId: { type: string }
        vendorName: { type: string }
        reason: { type: string }
        details: { type: string }
        amount: { type: integer, description: kobo }
        orderSubtotal: { type: integer, description: kobo }
        photos: { type: array, items: { type: string } }
        status:
          type: string
          enum: [requested, accepted, rejected, paid, confirmed, disputed, escalated]
        deadline: { type: string, format: date-time, description: Vendor must respond by then }
        vendorResponse:
          type: [object, 'null']
          properties:
            decision: { type: string, enum: [accepted, rejected] }
            amount: { type: integer, description: kobo; less than requested = partial }
            reason: { type: [string, 'null'] }
            at: { type: string, format: date-time }
        paymentReference: { type: [string, 'null'] }
        escalated: { type: boolean }
        timeline: { type: array, items: { $ref: '#/components/schemas/RefundStep' } }
        createdAt: { type: string, format: date-time }

    Notification:
      type: object
      properties:
        id: { type: string }
        type: { type: string, enum: [order, refund, social, review, subscription, payout, system] }
        title: { type: string }
        body: { type: string }
        link: { type: [string, 'null'], description: In-app path to open }
        readAt: { type: [string, 'null'], format: date-time }
        createdAt: { type: string, format: date-time }

    Plan:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        monthlyPrice: { type: integer, description: kobo }
        yearlyPrice: { type: integer, description: 'kobo; 12 × monthly minus the yearly discount' }
        limits:
          type: object
          properties:
            menuItems: { type: [integer, 'null'], description: null = unlimited }
            photosPerItem: { type: integer }
            staff: { type: integer }
        featured: { type: string, enum: [none, occasional, priority] }
        analytics: { type: string, enum: [basic, full, export] }
        isPopular: { type: boolean }
        sortOrder: { type: integer }

    PlanChoice:
      type: object
      required: [planId, interval]
      properties:
        planId: { type: string }
        interval: { type: string, enum: [monthly, yearly] }

    VendorSubscription:
      type: object
      properties:
        status: { type: string, enum: [none, trial, active, grace, expired] }
        trialAvailable: { type: boolean }
        trialDays: { type: integer }
        graceDays: { type: integer }
        subscription:
          type: [object, 'null']
          properties:
            id: { type: string }
            planId: { type: string }
            plan: { $ref: '#/components/schemas/Plan' }
            interval: { type: string, enum: [monthly, yearly] }
            amount: { type: integer, description: kobo per period }
            currentPeriodStart: { type: string, format: date-time }
            currentPeriodEnd: { type: string, format: date-time }
            trialEndsAt: { type: [string, 'null'], format: date-time }
            graceEndsAt: { type: [string, 'null'], format: date-time }
            cancelAtPeriodEnd: { type: boolean }
            scheduledChange:
              type: [object, 'null']
              properties:
                planId: { type: string }
                planName: { type: string }
                interval: { type: string, enum: [monthly, yearly] }

    VendorOnboarding:
      type: object
      properties:
        step: { type: string, enum: [type, business, location, documents, bank, review, submitted] }
        approvalStatus: { type: string, enum: [draft, pending, approved, rejected, suspended] }
        rejectionReason: { type: [string, 'null'] }
        submittedAt: { type: [string, 'null'], format: date-time }
        type: { type: [string, 'null'], enum: [restaurant, home_cook, null] }
        name: { type: string }
        description: { type: string }
        phone: { type: string }
        logo: { type: [string, 'null'] }
        cover: { type: [string, 'null'] }
        address: { type: [object, 'null'] }
        lat: { type: [number, 'null'] }
        lng: { type: [number, 'null'] }
        deliveryRadiusKm: { type: number }
        prepTimeMins: { type: integer }
        documents:
          type: array
          items:
            type: object
            properties:
              id: { type: string }
              type: { type: string }
              label: { type: string }
              url: { type: string }
              uploadedAt: { type: string, format: date-time }
        requiredDocuments:
          type: array
          items: { type: object, properties: { type: { type: string }, label: { type: string } } }
        bank:
          type: [object, 'null']
          properties:
            bankCode: { type: string }
            bankName: { type: string }
            accountNumber: { type: string }
            accountName: { type: string }
            verified: { type: boolean }

    MenuItemInput:
      type: object
      properties:
        name: { type: string, maxLength: 80 }
        description: { type: string, maxLength: 500 }
        categoryId: { type: string }
        price: { type: integer, description: kobo }
        portion: { type: string }
        prepTimeMins: { type: integer }
        photos: { type: array, items: { type: string }, description: up to the plan's photosPerItem }
        isAvailable: { type: boolean }
        availableDays: { type: array, items: { type: integer, minimum: 0, maximum: 6 } }
        availableFrom: { type: [string, 'null'], example: '07:00' }
        availableTo: { type: [string, 'null'], example: '11:00' }
        optionGroups:
          type: array
          items:
            type: object
            properties:
              id: { type: string }
              name: { type: string }
              required: { type: boolean }
              max: { type: integer }
              options:
                type: array
                items:
                  type: object
                  properties: { id: { type: string }, name: { type: string }, price: { type: integer } }

  responses:
    Session:
      description: Signed in
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Success'
              - properties:
                  data:
                    type: object
                    properties:
                      accessToken: { type: string }
                      user: { $ref: '#/components/schemas/User' }
    Unauthenticated:
      description: Not signed in or token expired
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    NotFound:
      description: Not found
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    Conflict:
      description: Already exists
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    RateLimited:
      description: Too many requests
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    ValidationError:
      description: Field errors
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    LikeState:
      description: Like state after the change
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Success'
              - properties:
                  data:
                    type: object
                    properties:
                      foodItemId: { type: string }
                      isLiked: { type: boolean }
                      likesCount: { type: integer }
    FollowState:
      description: Follow state after the change
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Success'
              - properties:
                  data:
                    type: object
                    properties:
                      vendorId: { type: string }
                      isFollowing: { type: boolean }
                      followersCount: { type: integer }
